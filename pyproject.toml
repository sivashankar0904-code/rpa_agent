[project]
name = "rpa-agent"
version = "0.1.0"
description = "FastMCP server exposing RPA-style automation tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "psutil>=7.0.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
rpa-agent = "rpa_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-psutil>=7.0.0",
]
